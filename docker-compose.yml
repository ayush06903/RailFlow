name: irctc-backend

services:
  postgres:
    image: postgres:15 #pulling postgres ki image from docker hub
    container_name: postgres       #agar kisi reason se container crash bhi hua to container hmesha automatically restart hoga
    restart: always
    environment:
      #is postgres service ko use krne ke lie jo credentials ki need hai 
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: irctcpass
      POSTGRES_DB: postgres         #default db
    ports:
      - "5432:5432"           #jis port pr hmari postgres service run hogi
      #left wla local machine ka port hai : right wla container ka port
    volumes:
      #since jo data hmara posgres db me data hai usko hme persist krna hai/permanently store krna hai bhle hi hmara container down ho jaye to we simultaneously store data in postgres db in given volume
      - postgres_data:/var/lib/postgresql/data
    networks:
      - irctc-network
  
  pgadmin:     #pgadmin is graphical user interface which manages postgres tables
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
    #jb hmm pgadmin ke ui ko hit krenge to we will put this email and password
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - irctc-network

  redis:            #will be used for caching
    image: redis/redis-stack:6.2.6-v19        #this image that we have pulled provides two things
                                                                                        #1->Redis server 
                                                                                        #2->Redis insight-->gui hai which will visualize the entries that we do in redis server
    container_name: redis
    restart: always
    environment:
      REDIS_ARGS: "--requirepass irctcpass"
                   #we set password(pass) in required field and the password in irctc pass
    ports:
      - "6379:6379"          #redis server ki local and container port
      - "8001:8001"          #redis insight ki local and container port
    volumes:
       #redis lka data will be permanently stored in this redis_data:/data volume
      - redis_data:/data
    networks:
      - irctc-network
  zookeeper:           #since hmare kafka server me multiple brokers ho skte hai to zookeeper 1->keeps track ki konseb zookeeper alive hain,kon se inactive,hain kon se inactive hai through heartbeat mechhanism
                                                                                            # 2->leader election
                                                                                            # 3->manages configuration of diffrent topics that are present in broker
                                                                                            # 4->stores metadata
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - irctc-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - irctc-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: always
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: irctc-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - irctc-network
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - irctc-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    restart: always
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - irctc-network
volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  es_data:

networks:
  irctc-network:
    driver: bridge
